<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesquisa de quem comprou | Advocacia de Impacto</title>
<meta name="description" content="Pesquisa rápida para quem comprou o Pós-Venda no Piloto Automático ou o ImpactMind RH.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14110D">

<!-- O título da aba e o nome do produto no topo são trocados pelo JS assim
     que o ?p= é lido. Aqui ficam os textos neutros, que servem para os dois
     produtos e para o caso de o link chegar sem parâmetro. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Advocacia de Impacto">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Conta pra gente como está o seu escritório">
<meta property="og:description" content="Menos de dois minutos. Suas respostas ajudam o Guilherme a preparar o que vem depois da sua compra.">
<meta property="og:image" content="https://forms.advocaciadeimpacto.adv.br/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23231b12'/><text y='23' x='16' text-anchor='middle' font-size='20' font-family='sans-serif' font-weight='bold' fill='%23d9b681'>A</text></svg>">
<style>
  /* Campo livre: o style.css só estiliza input. Mesmo visual do input. */
  .field textarea {
    width: 100%;
    padding: 14px 17px;
    background: var(--bg-2);
    border: 0;
    box-shadow: inset 0 0 0 1px var(--line-soft);
    color: var(--tx);
    font: inherit;
    font-size: 15.5px;
    line-height: 1.5;
    resize: vertical;
    transition: box-shadow 0.2s var(--ease), background 0.2s var(--ease);
  }
  .field textarea::placeholder { color: oklch(0.45 0.012 62); }
  .field textarea:focus { outline: 0; background: var(--bg-3); box-shadow: inset 0 0 0 2px var(--gold); }
  .estreito .field { max-width: none; }

  /* O produto escrito no topo, ao lado da marca: quem responde precisa ver
     de qual compra é a pesquisa antes da primeira pergunta. */
  .chapeu {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-dim);
    font-weight: 600;
    text-align: right;
    line-height: 1.3;
  }
  @media (max-width: 460px) { .chapeu { font-size: 10.5px; letter-spacing: 0.08em; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/pesquisa-lowticket">
      <img class="marca-logo" src="/marca-impacto.webp" srcset="/marca-impacto.webp 1x, /marca-impacto@2x.webp 2x" alt="Advocacia de Impacto" width="330" height="105" decoding="async">
    </a>
    <span class="chapeu" id="chapeu" hidden></span>
  </div>
  <div class="progress" id="barra" role="progressbar" aria-label="Progresso"><span></span></div>
</header>

<main>
  <div class="wrap" id="palco"></div>
</main>

<script type="module" src="pesquisa-lowticket.js"></script>
</body>
</html>
