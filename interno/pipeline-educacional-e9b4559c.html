/* ---------- busca ---------- */
var buscaQ = '', buscaRes = [], buscaI = -1, buscaT = 0, buscaVoo = 0;
function textoBusca(it){
  var d = it.d;
  if(it.kind === 'tpl') return [d.nome, d.id, d.etapa, d.momento, d.categoria, d.cabecalho, d.corpo, d.rodape, d.observacao].concat(d.botoes.map(function(b){ return b.texto; })).join(' ');
  var x = d.detalhes;
  return [d.titulo, d.subtitulo, d.id, d.badges.join(' '), x.resumo, x.sla, x.responsavel, x.entra.join(' '), x.observacoes.join(' '),
    x.automacoes.map(function(a){ return [a.quando,a.acao,a.canal,a.template].join(' '); }).join(' '),
    x.campos.map(function(c){ return c.campo+' '+c.valor; }).join(' '),
    x.saidas.map(function(s){ return s.condicao; }).join(' ')].join(' ');
}
function buscar(q){
  buscaQ = norm(q).trim();
  Array.prototype.forEach.call(document.querySelectorAll('.hit'), function(el){ el.classList.remove('hit','atual'); });
  var res = $('#busca-res');
  if(!buscaQ){ world.classList.remove('searching'); buscaRes = []; buscaI = -1; $('#busca-cont').textContent = ''; res.classList.remove('on'); res.innerHTML = ''; return; }
  var termos = buscaQ.split(/\s+/);
  buscaRes = [];
  Object.keys(itens).forEach(function(k){
    var it = itens[k]; if(it.kind === 'frame') return;
    if(!it._txt) it._txt = norm(textoBusca(it));
    if(!termos.every(function(t){ return it._txt.indexOf(t) >= 0; })) return;
    var tit = norm(it.kind === 'tpl' ? it.d.nome : it.d.titulo);
    buscaRes.push({it:it, s:(tit.indexOf(buscaQ) >= 0 ? 2 : 0) + (tit.indexOf(termos[0]) === 0 ? 1 : 0)});
  });
  buscaRes.sort(function(a,b){ return b.s - a.s || a.it.y - b.it.y || a.it.x - b.it.x; });
  buscaRes = buscaRes.map(function(r){ return r.it; });
  world.classList.add('searching');
  buscaRes.forEach(function(it){ it.el.classList.add('hit'); });
  buscaI = -1;
  $('#busca-cont').textContent = buscaRes.length ? buscaRes.length+'' : '0';
  res.innerHTML = buscaRes.length ? buscaRes.slice(0, 30).map(function(it, i){
    var cor = it.kind === 'tpl' ? '#00a884' : (rgb(it.d.cor) ? it.d.cor : TIPOS[it.d.tipo].cor);
    var tit = it.kind === 'tpl' ? (it.d.nome || it.d.id) : it.d.titulo;
    var sub = it.kind === 'tpl' ? 'Template · '+(it.d.momento || it.d.etapa || '') : TIPOS[it.d.tipo].rot+(itens[it.d.frame] ? ' · '+itens[it.d.frame].d.titulo : '');
    return '<button type="button" role="option" data-i="'+i+'"><span class="dot" style="background:'+cor+'"></span><span><b>'+esc(tit)+'</b><small>'+esc(sub)+'</small></span></button>';
  }).join('') : '<div class="vazio">Nada encontrado para “'+esc(q)+'”.</div>';
  res.classList.add('on');
}
function irResultado(i, abrir){
  if(!buscaRes.length) return;
  buscaI = (i + buscaRes.length) % buscaRes.length;
  var it = buscaRes[buscaI];
  Array.prototype.forEach.call(document.querySelectorAll('#busca-res button'), function(b){ b.classList.toggle('sel', +b.dataset.i === buscaI); });
  $('#busca-cont').textContent = (buscaI+1)+'/'+buscaRes.length;
  if(abrir && it.kind === 'node'){ abrirNode(it.d.id); return; }
  if(abrir && it.kind === 'tpl'){ fecharDrawer(true); focar(it, 0.7); pulso(it.el); return; }
  fecharDrawer(true);
  focar(it, 0.45); it.el.classList.remove('atual'); void it.el.offsetWidth; it.el.classList.add('atual');
}
function limparBusca(){ $('#busca').value = ''; buscar(''); }
function ligarBusca(){
  var inp = $('#busca'), res = $('#busca-res');
  inp.addEventListener('input', function(){
    clearTimeout(buscaT); clearTimeout(buscaVoo);
    buscaT = setTimeout(function(){ buscar(inp.value); }, 90);
    buscaVoo = setTimeout(function(){ if(buscaRes.length) irResultado(0); }, 520);
  });
  inp.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); clearTimeout(buscaVoo); if(buscaQ !== norm(inp.value).trim()) buscar(inp.value); irResultado(buscaI + (e.shiftKey ? -1 : 1)); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); irResultado(buscaI + 1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); irResultado(buscaI - 1); }
  });
  inp.addEventListener('focus', function(){ if(buscaQ) res.classList.add('on'); });
  res.addEventListener('mousedown', function(e){ e.preventDefault(); });
  res.addEventListener('click', function(e){ var b = e.target.closest('[data-i]'); if(!b) return; res.classList.remove('on'); inp.blur(); irResultado(+b.dataset.i, true); });
  document.addEventListener('pointerdown', function(e){ if(!e.target.closest('.busca')) res.classList.remove('on'); });
}

/* ---------- rotas (#node=ID, #tour=N) ---------- */
function rota(inicial){
  var h = decodeURIComponent((location.hash || '').slice(1));
  var m;
  if((m = /^node=(.+)$/.exec(h))){
    var it = itens[m[1]] || resolver(m[1]);
    if(it){
      if(it.kind === 'node'){ if(inicial){ abrirNode(it.d.id, true); focar(it, 0.5); } else abrirNode(it.d.id); return true; }
      if(it.kind === 'tpl'){ focar(it, 0.7); abrirTemplate(it.d.id); return true; }
      if(it.kind === 'frame'){ enquadrar(it, 40); return true; }
    }
  } else if((m = /^tour=(\d+)$/.exec(h))){
    var i = +m[1]-1; if(M.tours[i]){ irTour(i, inicial ? 0 : undefined); return true; }
  }
  return false;
}

/* ---------- boot ---------- */
function tamanho(){ VW = vp.clientWidth; VH = vp.clientHeight; }
function erro(msg){
  var l = $('#loader'); l.classList.add('erro');
  $('#loader-msg').innerHTML = msg;
}
var iniciado = false;
function boot(fonte){
  if(iniciado) return; iniciado = true;

  if(!window.MAPA || typeof window.MAPA !== 'object'){
    erro('Não encontrei <b>window.MAPA</b>.<pre>Verifique se o arquivo dados.js está na mesma pasta do index.html e se não tem erro de sintaxe\n(rode:  node --check dados.js).\n'+(window.__mapaErro ? '\nErro: '+esc(window.__mapaErro) : '')+'</pre>');
    return;
  }
  try{
    M = normalizar(window.MAPA);
    document.title = M.meta.titulo || 'Pipeline';
    var tt = esc(M.meta.titulo || 'Pipeline').replace(/·\s*(.+)$/, '· <em>$1</em>');
    $('#t-titulo').innerHTML = tt;
    $('#t-sub').textContent = [M.meta.subtitulo, M.meta.data].filter(Boolean).join(' · ');
    $('#t-sub').title = [M.meta.subtitulo, M.meta.autor, M.meta.data].filter(Boolean).join(' · ');
    $('#n-campos').textContent = M.campos.length || '';
    $('#n-mud').textContent = M.mudancas.length || '';
    if(!M.campos.length) $('#b-campos').hidden = true;
    if(!M.mudancas.length) $('#b-mud').hidden = true;
    renderFrames(); renderNodes(); renderTemplates();
    tamanho();
    ligarInteracao(); ligarMinimapa(); ligarDrawer(); ligarModal(); ligarBusca(); renderTours();
    var fontesProntas = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(function(r){ setTimeout(r, 2500); })]) : Promise.resolve();
    fontesProntas.then(function(){
      medir(); validar(); renderEdges();
      bounds = limites(); desenharMinimapa();
      if(!rota(true)){ ajustarTudo(0); }
      aplicar();
      if(avisos.length){
        var b = $('#b-avisos'); b.hidden = false; b.innerHTML = ICO.alerta+avisos.length;
        console.warn('[mapa] '+avisos.length+' aviso(s) nos dados:\n - '+avisos.join('\n - '));
      }
      console.info('[mapa] carregado de '+(fonte || 'dados embutidos')+': '+M.frames.length+' frames, '+M.nodes.length+' nodes, '+M.edges.length+' setas, '+M.templates.length+' templates');
      $('#loader').classList.add('fora');
      setTimeout(function(){ $('#loader').style.display = 'none'; }, 400);
    });
  }catch(err){
    console.error(err);
    erro('Erro ao montar o quadro.<pre>'+esc(err && err.stack || err)+'</pre>');
  }
  window.addEventListener('resize', function(){
    var c = centro(); tamanho(); setCentro(c.x, c.y, cam.z); agenda();
  });
  window.addEventListener('hashchange', function(){ rota(false); });
}
window.__mapaBoot = boot;
window.__mapaApi = { voar:voar, irTour:irTour, abrirNode:abrirNode, abrirCampos:abrirCampos, abrirMudancas:abrirMudancas, abrirTemplate:abrirTemplate, cam:cam, avisos:function(){ return avisos; }, itens:function(){ return itens; } };
})();
