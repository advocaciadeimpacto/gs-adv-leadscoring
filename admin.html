<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso do painel · Advocacia de Impacto</title>
<meta name="theme-color" content="#14110D">
<!-- página de acesso do time: fora de busca, sem link público -->
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23231b12'/><text y='23' x='16' text-anchor='middle' font-size='20' font-family='sans-serif' font-weight='bold' fill='%23d9b681'>A</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="admin">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 4h13l3 3v3h-4V8H8v3h9l3 3v6l-3 3H4l-3-3v-3h4v3h9v-3H5l-3-3V7l2-3z" fill="#C9A876"/>
      </svg>
      Advocacia de Impacto
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="step estreito">
      <span class="eyebrow">Acesso restrito</span>
      <h1 class="q-title">Painel interno</h1>
      <p class="q-help">Essa área é só para o time. Entre com sua conta.</p>

      <form id="form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        </div>
        <p class="erro" id="erro" hidden>E-mail ou senha incorretos.</p>
        <button class="btn chanfro" type="submit" id="entrar">Entrar</button>
      </form>
    </div>
  </div>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
